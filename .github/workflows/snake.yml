name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Arupika
          outputs: |
            dist/github-snake.svg?color_snake=random&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&snake_order=random
            dist/github-snake-dark.svg?palette=github-dark&color_snake=random&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&snake_order=random
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
